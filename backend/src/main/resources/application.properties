# ==============================================================================
# CONFIGURACIÓN DE CONEXIÓN POSTGRESQL - BIBLIOTECA HORIZONTE
# ==============================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/bilbio_horizonte
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.password=${DB_PASSWORD:123456}

# Configuración del Pool HikariCP optimizado para consultas de alta velocidad (<1s)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# ==============================================================================
# JPA / HIBERNATE
# ==============================================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# 'validate' para asegurar que la base de datos se gestione estrictamente por Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ==============================================================================
# MIGRACIONES FLYWAY
# ==============================================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ==============================================================================
# SERVIDOR WEB
# ==============================================================================
server.port=${API_PORT:8787}
server.servlet.context-path=/api/v1
server.error.include-message=always
server.error.include-binding-errors=always
